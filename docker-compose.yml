services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nomadly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nomadly
      POSTGRES_PASSWORD: nomadly_local_password
      POSTGRES_DB: nomadly
    ports:
      - "5433:5432"
    volumes:
      - nomadly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomadly -d nomadly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomadly-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - nomadly_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nomadly_postgres_data:
  nomadly_redis_data:
