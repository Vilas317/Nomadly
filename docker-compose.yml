services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nomadly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nomadly
      POSTGRES_PASSWORD: nomadly_local_password
      POSTGRES_DB: nomadly
    ports:
      - "5433:5432"
    volumes:
      - nomadly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomadly -d nomadly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nomadly_postgres_data:
